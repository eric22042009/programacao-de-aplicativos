<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simple Pong</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#0B1220;
      --accent:#00D1FF;
      --accent-2:#FFD166;
      --panel: rgba(255,255,255,0.03);
      --text: #E6EEF6;
    }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 10% 10%, #071021 0%, var(--bg) 60%);
      color:var(--text);
    }

    .game-wrap{
      width:880px;
      max-width:95vw;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:18px;
      border-radius:10px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.7);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:8px;
    }

    .score{
      font-size:20px;
      font-weight:600;
      letter-spacing:1px;
    }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
    }

    button{
      background:var(--panel);
      color:var(--text);
      border:1px solid rgba(255,255,255,0.04);
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
    }
    button:hover{filter:brightness(1.1)}
    canvas{
      display:block;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.0));
      border-radius:6px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      cursor:default;
    }

    .hint{
      margin-top:8px;
      font-size:13px;
      color:rgba(230,238,246,0.7);
    }
    @media (max-width:520px){
      .game-wrap{padding:12px}
      .score{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="topbar">
      <div class="score" id="scoreboard">Player 0 — 0 Computer</div>
      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>

    <canvas id="pong" width="800" height="500"></canvas>
    <div class="hint">Control left paddle with your mouse or Up / Down keys. Click Start to begin.</div>
  </div>

  <script>
    // Basic Pong implementation using canvas
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');

    // Game parameters
    const W = canvas.width;
    const H = canvas.height;

    // Paddle properties
    const PADDLE_WIDTH = 12;
    const PADDLE_HEIGHT = 110;
    const PADDLE_SPEED = 6;

    // Ball properties
    const BALL_RADIUS = 8;
    const BALL_SPEED_START = 4;
    const BALL_SPEED_INCREMENT = 0.2;
    const BALL_MAX_SPEED = 12;

    // Game state
    let leftPaddle = { x: 12, y: (H - PADDLE_HEIGHT) / 2, vy: 0 };
    let rightPaddle = { x: W - PADDLE_WIDTH - 12, y: (H - PADDLE_HEIGHT) / 2, vy: 0 };
    let ball = { x: W/2, y: H/2, vx: BALL_SPEED_START, vy: 0, speed: BALL_SPEED_START };
    let score = { player: 0, computer: 0 };

    let running = false;
    let animationId = null;
    let keys = { ArrowUp:false, ArrowDown:false };

    // DOM
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreboard = document.getElementById('scoreboard');

    // Helpers
    function resetBall(direction = 0){
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = BALL_SPEED_START;
      // direction: 0 = random, -1 = to left (player), 1 = to right (computer)
      const angle = (Math.random() * Math.PI/4) - (Math.PI/8); // -22.5deg..22.5deg
      const dir = direction || (Math.random() > 0.5 ? 1 : -1);
      ball.vx = dir * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    // Draw functions
    function drawBackground(){
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.fillRect(0, 0, W, H);

      // center dashed line
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 14]);
      ctx.beginPath();
      ctx.moveTo(W/2, 0);
      ctx.lineTo(W/2, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(p){
      ctx.fillStyle = '#E6EEF6';
      roundRect(ctx, p.x, p.y, PADDLE_WIDTH, PADDLE_HEIGHT, 4, true, false);
    }

    function drawBall(){
      ctx.fillStyle = '#00D1FF';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
      ctx.fill();
      // glow
      ctx.fillStyle = 'rgba(0,209,255,0.12)';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_RADIUS*3.2, 0, Math.PI*2);
      ctx.fill();
    }

    function drawScore(){
      scoreboard.textContent = `Player ${score.player} — ${score.computer} Computer`;
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke){
      if (typeof r === 'undefined') r = 5;
      if (typeof r === 'number') r = {tl:r, tr:r, br:r, bl:r};
      ctx.beginPath();
      ctx.moveTo(x + r.tl, y);
      ctx.lineTo(x + w - r.tr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
      ctx.lineTo(x + w, y + h - r.br);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
      ctx.lineTo(x + r.bl, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
      ctx.lineTo(x, y + r.tl);
      ctx.quadraticCurveTo(x, y, x + r.tl, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    // Collision detection: AABB for paddle and circle for ball
    function paddleBallCollision(p){
      // approximate paddle as rectangle
      const rx = p.x, ry = p.y, rw = PADDLE_WIDTH, rh = PADDLE_HEIGHT;
      // find closest point to ball center
      const closestX = clamp(ball.x, rx, rx + rw);
      const closestY = clamp(ball.y, ry, ry + rh);
      const dx = ball.x - closestX;
      const dy = ball.y - closestY;
      return (dx*dx + dy*dy) <= (BALL_RADIUS * BALL_RADIUS);
    }

    // Update game state
    function update(){
      // Player paddle movement via keys
      if (keys.ArrowUp) leftPaddle.y -= PADDLE_SPEED;
      if (keys.ArrowDown) leftPaddle.y += PADDLE_SPEED;

      // Keep paddles on screen
      leftPaddle.y = clamp(leftPaddle.y, 0, H - PADDLE_HEIGHT);
      rightPaddle.y = clamp(rightPaddle.y, 0, H - PADDLE_HEIGHT);

      // Simple AI for right paddle
      const paddleCenter = rightPaddle.y + PADDLE_HEIGHT / 2;
      const targetY = ball.y;
      // AI speed depends on ball position to keep it beatable
      const aiSpeed = (ball.x > W/2) ? 5.0 : 3.0;
      if (paddleCenter < targetY - 6) rightPaddle.y += aiSpeed;
      else if (paddleCenter > targetY + 6) rightPaddle.y -= aiSpeed;
      rightPaddle.y = clamp(rightPaddle.y, 0, H - PADDLE_HEIGHT);

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall collisions (top/bottom)
      if (ball.y - BALL_RADIUS <= 0){
        ball.y = BALL_RADIUS;
        ball.vy = -ball.vy;
      } else if (ball.y + BALL_RADIUS >= H){
        ball.y = H - BALL_RADIUS;
        ball.vy = -ball.vy;
      }

      // Paddle collisions
      // Left paddle
      if (ball.vx < 0 && paddleBallCollision(leftPaddle)){
        ball.x = leftPaddle.x + PADDLE_WIDTH + BALL_RADIUS; // avoid sticking
        reflectFromPaddle(leftPaddle);
      }

      // Right paddle
      if (ball.vx > 0 && paddleBallCollision(rightPaddle)){
        ball.x = rightPaddle.x - BALL_RADIUS; // avoid sticking
        reflectFromPaddle(rightPaddle);
      }

      // Score: ball passes left or right edge
      if (ball.x - BALL_RADIUS <= 0){
        // Computer scores
        score.computer += 1;
        drawScore();
        resetBall(1); // send to right initially
      } else if (ball.x + BALL_RADIUS >= W){
        // Player scores
        score.player += 1;
        drawScore();
        resetBall(-1);
      }
    }

    function reflectFromPaddle(paddle){
      // Determine where on the paddle the ball hit to alter angle
      const paddleCenter = paddle.y + PADDLE_HEIGHT / 2;
      const hitPos = (ball.y - paddleCenter) / (PADDLE_HEIGHT / 2); // -1 .. 1
      const maxBounceAngle = (Math.PI / 3); // 60 degrees max
      const angle = hitPos * maxBounceAngle;

      const direction = (paddle === leftPaddle) ? 1 : -1;
      // Increase speed slightly
      ball.speed = Math.min(BALL_MAX_SPEED, ball.speed + BALL_SPEED_INCREMENT);
      ball.vx = direction * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function render(){
      ctx.clearRect(0,0,W,H);
      drawBackground();

      // draw paddles and ball
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
      // optional scoreboard inside canvas (we update DOM scoreboard separately)
      ctx.fillStyle = 'rgba(230,238,246,0.08)';
      ctx.font = '18px system-ui, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${score.player}  —  ${score.computer}`, W/2, 28);
    }

    function loop(){
      update();
      render();
      if (running) animationId = requestAnimationFrame(loop);
    }

    // Controls and events
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const y = e.clientY - rect.top;
      // center paddle on mouse Y
      leftPaddle.y = clamp(y - PADDLE_HEIGHT / 2, 0, H - PADDLE_HEIGHT);
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        keys[e.key] = true;
        e.preventDefault();
      }
      if (e.key === ' '){
        // Space toggles start/pause
        toggleRunning();
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        keys[e.key] = false;
        e.preventDefault();
      }
    });

    startBtn.addEventListener('click', () => {
      startGame();
    });
    pauseBtn.addEventListener('click', () => {
      pauseGame();
    });
    resetBtn.addEventListener('click', () => {
      resetGame();
    });

    function startGame(){
      if (!running){
        running = true;
        if (!animationId) loop();
      }
    }
    function pauseGame(){
      running = false;
      if (animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }
    function toggleRunning(){
      if (running) pauseGame(); else startGame();
    }

    function resetGame(){
      pauseGame();
      score.player = 0;
      score.computer = 0;
      leftPaddle.y = (H - PADDLE_HEIGHT) / 2;
      rightPaddle.y = (H - PADDLE_HEIGHT) / 2;
      resetBall();
      drawScore();
      render();
    }

    // Initialize
    resetBall();
    drawScore();
    render();

    // Make canvas scale friendly on high DPI screens
    (function adjustForHiDPI() {
      const dpr = window.devicePixelRatio || 1;
      if (dpr !== 1){
        const bw = canvas.width;
        const bh = canvas.height;
        canvas.width = bw * dpr;
        canvas.height = bh * dpr;
        canvas.style.width = bw + 'px';
        canvas.style.height = bh + 'px';
        ctx.scale(dpr, dpr);
      }
    })();

  </script>
</body>
</html>
